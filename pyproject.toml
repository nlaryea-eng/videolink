[project]
name = "videolink"
version = "0.1.0"
description = "Clipboard video playback with local live subtitles"
requires-python = ">=3.12,<3.13"
dependencies = [
  "yt-dlp>=2026.10.21",
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
]

[project.optional-dependencies]
mlx = ["mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'"]
faster-whisper = ["faster-whisper"]
whispercpp = ["pywhispercpp"]

[tool.uv]
package = false

[dependency-groups]
dev = ["uv==0.13.5"]
